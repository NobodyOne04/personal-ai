# personal-ai configuration. Secrets never go here: they come from PERSONAL_AI_* environment
# variables. Unknown keys are rejected. Durations use Go syntax (10s, 2m, 1h).
server:
  addr: ":8080"
  read_header_timeout: 10s
  read_timeout: 30s
  idle_timeout: 2m
  shutdown_timeout: 30s
  max_body_bytes: 1048576

log:
  level: info
  format: json # json or text

scheduling:
  interval: 1m
  idle_timeout: 30m # stop a deployment after this long without requests
  max_active: 1     # hard cap on running deployments (and GPU spend)

routing:
  not_deployed_policy: reject # reject | start_and_wait | start_and_return_pending
  wait_timeout: 20m

compute:
  runpod:
    cloud_type: SECURE # SECURE or COMMUNITY
    name_prefix: pai-
    container_disk_gb: 50
    volume_gb: 0
    # The only hardware that may ever be rented. hourly_usd is for cost estimates.
    offerings:
      - { id: a40-1x, gpu_type_id: NVIDIA A40, gpu_count: 1, vram_per_gpu_gb: 48, hourly_usd: 0.40 }
      - { id: a100-80g-1x, gpu_type_id: NVIDIA A100 80GB PCIe, gpu_count: 1, vram_per_gpu_gb: 80, hourly_usd: 1.64 }

deployment:
  provision_timeout: 15m
  ready_timeout: 30m
  poll_interval: 10s
  storage_gb: 0

runtime:
  image: vllm/vllm-openai:v0.33.0
  # allowed_images: []            # other images models may name (ADR 0008)
  # allow_trust_remote_code: false
  # allow_extra_args: false

client:
  api_url: http://localhost:8080
  timeout: 10m

telegram:
  allowed_user_ids: [] # Telegram user IDs allowed to use the bot

default_model: example-model

models:
  - id: example-model
    name: Example Model
    artifact: organization/model-name
    description: Replace with a real model.
    features: [chat]
    requirements: { min_vram_gb: 24, recommended_vram_gb: 32, min_gpu_count: 1 }
    runtime: { max_model_len: 8192, dtype: auto, gpu_memory_utilization: 0.9 }
    generation: { temperature: 0.7, top_p: 0.9, max_tokens: 2048 }
