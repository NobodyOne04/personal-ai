apiVersion: v1
kind: Service
metadata:
  name: personal-ai-postgres
  labels:
    app.kubernetes.io/name: personal-ai-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: personal-ai-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: personal-ai-postgres
  labels:
    app.kubernetes.io/name: personal-ai-postgres
spec:
  serviceName: personal-ai-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: personal-ai-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personal-ai-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: personal_ai
            - name: POSTGRES_USER
              value: personal_ai
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: personal-ai-secrets, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "personal_ai", "-d", "personal_ai"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "personal_ai", "-d", "personal_ai"]
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Only the API server may talk to the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: personal-ai-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: personal-ai-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: personal-ai-server
      ports:
        - port: 5432
